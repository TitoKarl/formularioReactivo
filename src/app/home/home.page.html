
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Formulario reactivo
    </ion-title>

    <ion-button slot="end" fill="clear" (click)="cambiarModoOscuro()">
      {{ modoOscuro() ? 'Modo claro' : 'Modo oscuro' }}
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [class.dark-mode]="modoOscuro()">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Registro</ion-title>
    </ion-toolbar>
  </ion-header>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">
      <!-- Campo Nombre -->
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          type="text"
          formControlName="nombre"
          [errorText]="'El nombre es obligatorio (mín. 3 caracteres).'">
        </ion-input>
      </ion-item>

      <!-- Campo Email con teclado específico para móviles -->
      <ion-item>
        <ion-input
          label="Correo Electrónico"
          labelPlacement="floating"
          type="email"
          inputmode="email"
          formControlName="email"
          [errorText]="'Introduzca un email válido.'">
        </ion-input>
      </ion-item>

      <!-- Campo Contraseña -->
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          [errorText]="'Mínimo 8 caracteres, letras y números.'">
        </ion-input>
      </ion-item>

      <!-- Campo Fecha -->
      <ion-item>
        <ion-input
          label="Fecha"
          labelPlacement="floating"
          type="date"
          formControlName="fecha"
          [min]="fechaMinima"
          [errorText]="'Seleccione una fecha igual o posterior a hoy.'">
        </ion-input>
      </ion-item>
    </ion-list>

    <div class="ion-padding-top">
      <!-- Botón dinámico que responde al Signal -->
      <ion-button
        expand="block"
        type="submit"
        [disabled]="registroForm.invalid || isSubmitting()">
        <span *ngIf="!isSubmitting()">Registrarse</span>
        <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
      </ion-button>
    </div>
  </form>

  <div class="ion-padding" *ngIf="datosEnviados">
    <ion-button expand="block" (click)="descargarPDF()">
      Descargar datos en PDF
    </ion-button>
  </div>
</ion-content>
